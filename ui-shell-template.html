<link rel="stylesheet" href="css/sense-theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--cream);font-family:var(--font-sans);overflow:hidden}
:root{--app-donker:var(--date-donker);--app-medium:var(--date-medium);--app-licht:var(--date-licht);--r:var(--app-donker);--g:rgba(255,255,255,.75);--b:rgba(61,47,31,.12)}
.app{position:relative;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,rgba(248,212,210,.28) 0%,var(--cream) 220px,var(--cream) 100%)}
.bg-art{position:fixed;inset:0;z-index:0;pointer-events:none}
.topbar{position:relative;z-index:2;display:flex;align-items:center;padding:12px 14px 8px;padding-top:calc(12px + var(--st));flex-shrink:0;background:rgba(242,232,213,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(61,47,31,.08)}
.tb-title{flex:1;font-size:var(--fs-md);font-weight:700;text-align:center;color:var(--t);font-family:var(--font-serif)}
.ico{width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:none;border:none;border-radius:19px;touch-action:manipulation}
.ico{transition:background .18s ease}
.ico:active{background:var(--g)}
.quick-nav{position:relative;z-index:2;display:flex;justify-content:flex-end;gap:6px;padding:6px 14px 8px;background:rgba(242,232,213,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(61,47,31,.06);flex-shrink:0}
.quick-nav-btn{border:1px solid var(--b);background:#fff;color:#555;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;touch-action:manipulation}
.logobar{position:relative;z-index:1;display:flex;align-items:flex-start;gap:12px;padding:10px 16px 12px;flex-shrink:0}
.av{width:42px;height:42px;border-radius:21px;overflow:hidden;flex-shrink:0;border:2px solid var(--b);background:#eee}
.brand{line-height:1;min-height:40px;display:flex;align-items:center;text-decoration:none;color:inherit}
.brand-logo{height:36px;width:auto;display:block;object-fit:contain}
.brand-fallback{font-size:var(--fs-xl);font-weight:800;color:var(--t);letter-spacing:-.5px;line-height:1;display:inline-block;font-family:var(--font-serif)}
.tag{display:block;margin-top:4px;max-width:min(100%,280px);font-family:var(--font-serif);font-style:italic;font-size:13px;line-height:1.38;letter-spacing:.01em;color:var(--sage-donker)}
.tag .tag-main{display:block;font-weight:700;color:var(--sage-donker)}
.tag .tag-sub{display:block;margin-top:2px;font-size:12px;font-weight:600;font-style:italic;color:var(--app-medium)}
.build-tag-top{position:relative;display:inline-flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:min(100%,200px);pointer-events:auto;padding:7px 10px;border-radius:999px;border:1px solid var(--b);background:rgba(255,255,255,.86);backdrop-filter:blur(6px);font-size:12px;font-weight:800;color:var(--t);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.build-user-top{position:relative;display:block;max-width:min(100%,220px);font-size:11px;font-weight:600;color:#777;text-align:right;line-height:1.35}
.logobar-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;padding-top:2px;text-align:right}
.logobar-brand-wrap{flex:1;min-width:0}
.logobar .build-tag-top,.logobar .build-user-top{z-index:1}
.app-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;position:relative;z-index:1}
.main{position:relative;z-index:1;flex:0 0 auto;width:100%;overflow:visible}
.card{border-radius:16px;padding:14px 15px;background:#fff;margin:10px auto;max-width:460px;border:1px solid rgba(0,0,0,.07);box-shadow:0 2px 8px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.05)}
.card h2{font-family:var(--font-serif);font-size:21px;color:var(--t);margin-bottom:8px}
.card p{font-size:14px;color:#666;line-height:1.55}
.input-bar{background:#fff;border-top:2px solid var(--b);flex-shrink:0;padding:10px 14px;padding-bottom:calc(10px + var(--sb))}
.input-stack-vertel{display:flex;flex-direction:column;gap:6px;width:100%;min-height:0}
.input-toolbar-vertel{display:flex;align-items:center;gap:8px;width:100%;flex-wrap:nowrap}
.vertel-mic-hint-row{display:flex;align-items:center;gap:8px;width:100%;margin:0;padding:2px 0 0;min-height:0;flex-wrap:nowrap}
.vertel-mic-hint-row--inline{flex:1 1 0;min-width:0;width:auto;padding:0;margin:0}
.vertel-mic-hint-row--inline .rnd.rd-mic{flex-shrink:0}
.vertel-mic-hint{flex:1;min-width:0;font-size:10px;font-weight:600;color:#b0101d;line-height:1.3;margin:0}
.input-area{flex:1;background:var(--g);border:1.5px solid var(--b);border-radius:20px;padding:13px 18px;font-size:var(--fs-md);color:#333;outline:none;font-family:inherit;resize:none;min-height:50px;max-height:130px;line-height:1.4}
.input-area-vertel{width:100%;min-height:72px;max-height:168px}
.rnd{width:46px;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;border:none;position:relative;z-index:2;touch-action:manipulation}
.rnd.gr{background:var(--g);border:1.5px solid var(--b)}
.rnd.rd{background:var(--r)}
.rnd.rd svg{stroke:#fff}
.rnd.rd-mic{background:#eceff3;border:1.5px solid #d0d8e0;color:#555;touch-action:none;-webkit-user-select:none;user-select:none}
.rnd.rd-mic svg{stroke:#555}
.rnd.rd-mic.rnd-mic-on{background:var(--r);border-color:var(--r);box-shadow:0 4px 12px rgba(186,86,84,.28)}
.rnd.rd-mic.rnd-mic-on svg{stroke:#fff}
.nav{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(0,0,0,.08);display:flex;padding:6px 0;padding-bottom:calc(6px + var(--sb));flex-shrink:0;position:relative;z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:16px 0 4px;cursor:pointer;color:var(--m);background:none;border:none;position:relative;transition:color .16s ease;touch-action:manipulation}
.tab.active{color:var(--r)}
.nav-tab-rimpel{position:absolute;top:1px;left:50%;transform:translateX(-50%);width:22px;height:22px;pointer-events:none;z-index:1;opacity:0;transition:opacity .18s ease}
.tab.active .nav-tab-rimpel{opacity:1}
.nav-tab-rimpel > span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%}
.nav-tab-rimpel > span:nth-child(1){width:100%;height:100%;background:var(--app-licht)}
.nav-tab-rimpel > span:nth-child(2){width:calc(100% * 58 / 72);height:calc(100% * 58 / 72);background:var(--app-medium)}
.nav-tab-rimpel > span:nth-child(3){width:calc(100% * 44 / 72);height:calc(100% * 44 / 72);background:var(--app-donker)}
.tab.active .nav-tab-rimpel > span:nth-child(1){opacity:.26}
.tab.active .nav-tab-rimpel > span:nth-child(2){opacity:.2}
.tab.active .nav-tab-rimpel > span:nth-child(3){opacity:.14}
.tab.active .nav-tab-rimpel::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% * 20 / 72);height:calc(100% * 20 / 72);min-width:5px;min-height:5px;border-radius:50%;background:var(--app-donker);z-index:2;opacity:.38}
.tab svg{width:23px;height:23px;position:relative;z-index:2}
.tab span{font-size:var(--fs-xs);font-weight:600}
@media (max-width:420px){
  .topbar{padding:10px 10px 8px;padding-top:calc(10px + var(--st))}
  .logobar{gap:10px;padding:9px 12px 11px}
  .logobar-meta{max-width:42%}
  .build-tag-top{padding:6px 8px;font-size:11px;max-width:min(100%,160px)}
  .build-user-top{font-size:11px;max-width:min(100%,180px)}
  .input-bar{padding:8px 10px;padding-bottom:calc(8px + var(--sb))}
  .input-stack-vertel{gap:5px}
  .input-toolbar-vertel{gap:7px;flex-wrap:nowrap}
  .input-area{padding:12px 14px;min-height:46px}
  .input-area-vertel{padding:10px 12px;min-height:64px;max-height:min(24dvh,156px)}
  .rnd{width:42px;height:42px;border-radius:21px}
}
</style>
</head>
