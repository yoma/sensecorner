async function finishMirrorAdem(note){

    if(sb&&S.user){
      var ins=await sb.from('selfsense_mirror_sessions').insert({
        user_id:S.user.id,
        mode:'adem',
        duration_seconds:dur,
        messages_count:null,
        note:note?String(note).substring(0,200):null
      });
      if(ins&&ins.error)throw ins.error;
    }
  }catch(e){
    toast('Sessie kon niet volledig opgeslagen worden');
  }
  S.mirror.active=false;
  closeMirrorOverlay();
  await loadTimelineEvents();
  await loadMirrorSessions();

}

async function handleMirrorUserInput(text){
  var t=String(text||'').trim();
  if(!t)return;
  if(S.mirror.paused){renderMirrorPausePrompt();return;}
  var mode=S.mirror.mode==='gesprek'?'gesprek':'praat';
  var maxTurns=mode==='gesprek'?4:3;
  var modeLabel=mode==='gesprek'?'Gesprek':'Praat';
  S.mirror.currentTranscript=t;
  S.mirror.messages.push({role:'user',text:t});
  S.mirror.userTurns++;
  if(detectCrisis(t)){
    await logCrisis('keyword');
    await finalizeMirrorConversation('[Sessie onderbroken]',true);
    setCrisisMode(true,CRISIS_TEXT);
    return;
  }
  var convo=(S.mirror.messages||[]).slice(-8).map(function(m){return {role:m.role==='assistant'?'assistant':'user',content:m.text};});
  var sys=mode==='gesprek'
    ?'Je bent Sensei in de Gesprek-modus van SelfSense. Dit is samen-denken, geen advies-relatie. Reflecteer terug, vraag door, deel observaties als ze passen. Antwoord in 2-4 zinnen. Geen lijstjes, geen oplossingen, geen interpretaties van patronen of betekenis. Houd in de gaten: de sessie wordt afgerond na 4 gebruikersronden, dus laat de laatste 1-2 ronden zacht afronden.\n\nCRITISCH: pas crisis-detectie toe zoals eerder. Als crisis, start antwoord met [CRISIS].'+(S.ownFactsContext?('\n\nCONTEXT:\n'+S.ownFactsContext):'')
    :'Je bent Sensei in de Praat-modus van SelfSense. De gebruiker spreekt iets uit, jij luistert en reflecteert zacht terug. Geen advies, geen oplossingen, geen oefeningen. Antwoord in 2-3 zinnen, warm. Optioneel een doorvraag als het natuurlijk past.\n\nCRITISCH: pas crisis-detectie toe zoals eerder. Als crisis, start antwoord met [CRISIS].'+(S.ownFactsContext?('\n\nCONTEXT:\n'+S.ownFactsContext):'');
  try{
    var ai=await callSensei(sys,convo,500,30000);
    if(String(ai||'').trim().indexOf('[CRISIS]')===0){
      await logCrisis('ai');
      ai=String(ai||'').replace(/^\[CRISIS\]\s*/,'');
      await finalizeMirrorConversation('[Sessie onderbroken]',true);
      setCrisisMode(true,ai||CRISIS_TEXT);
      return;
    }
    S.mirror.messages.push({role:'assistant',text:ai});
    S.mirror.currentTranscript='';
    if(S.mirror.userTurns>=maxTurns){
      await startMirrorSummaryFlow();

function startMirrorListening(){

  S.mirror.currentTranscript='';

  if(!Ctor){S.mirror.speechEnabled=false;openMirrorTypeFallback();return;}
  var rec=new Ctor();
  S.mirror.speechRec=rec;
  rec.lang='nl-BE';
  rec.interimResults=true;
  rec.continuous=true;
  rec.onresult=function(ev){
    var txt='';
    for(var i=ev.resultIndex;i<ev.results.length;i++)txt+=ev.results[i][0].transcript||'';
    S.mirror.currentTranscript=String(txt||'').trim();
    renderMirrorConversation();
  };
  rec.onerror=function(){S.mirror.isListening=false;renderMirrorConversation();};
  rec.onend=function(){S.mirror.isListening=false;renderMirrorConversation();};
  try{rec.start();S.mirror.isListening=true;renderMirrorConversation();}catch(e){S.mirror.isListening=false;openMirrorTypeFallback();}

function buildTimelineHtml(){

  allItems.forEach(function(it){
    var t=String(it.type||'');
    if(t==='checkin'||t==='crisis'||t==='mirror')counts[t]++;
  });
  var items=allItems.filter(function(it){
    if(f==='all')return true;
    return String(it.type||'')===f;
  }).slice(0,12);
  var filters=[

  ];
  var chips='<div class="timeline-filters">'+filters.map(function(x){
    var active=x.id===f?' active':'';

    return '<button class="timeline-chip'+active+'" type="button" onclick="setTimelineFilter(\''+escJsStr(x.id)+'\')">'+escHTML(x.label+' ('+n+')')+'</button>';
  }).join('')+'</div>';

  var rows=items.map(function(it){

async function buildSelfSenseContext(){
  if(!sb||!S.user)return'';
  var factsRes=await sb.from('own_facts').select('category,fact_text,is_constraint,confidence,status').eq('user_id',S.user.id).eq('status','accepted').order('confidence',{ascending:false}).limit(60);
  if(factsRes&&factsRes.error)return'';
  var rows=(factsRes&&factsRes.data)||[];
  if(!rows.length)return'';
  var constraints=rows.filter(function(f){return !!f.is_constraint;});
  var regular=rows.filter(function(f){return !f.is_constraint;});
  var context='';
  if(constraints.length){
    context+='HARDE CONSTRAINTS, NOOIT OVERSCHRIJDEN:\n';
    context+='De gebruiker heeft expliciet aangegeven dat dit niet werkt:\n';
    constraints.slice(0,12).forEach(function(c){context+='- '+String(c.fact_text||'').trim()+'\n';});
    context+='\nStel deze dingen nooit voor, ook niet als oefening of als chip.\n\n';
  }
  if(regular.length){
    context+='WAT IK WEET OVER DE GEBRUIKER:\n';
    var byCat={};
    regular.forEach(function(f){var k=String(f.category||'algemeen').trim()||'algemeen';if(!byCat[k])byCat[k]=[];byCat[k].push(String(f.fact_text||'').trim());});
    Object.keys(byCat).forEach(function(cat){
      context+='\n['+cat+']\n';
      byCat[cat].slice(0,8).forEach(function(t){if(t)context+='- '+t+'\n';});
    });
  }
  return context.trim();
}

function dateOnly(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function areConsecutiveDays(a,b){var x=new Date(a.getFullYear(),a.getMonth(),a.getDate());var y=new Date(b.getFullYear(),b.getMonth(),b.getDate());var diff=Math.abs(x-y)/(1000*60*60*24);return diff===1;}
async function loadRecentCheckins(){if(!sb||!S.user){S.checkins=[];return;}try{var q=await sb.from('selfsense_checkins').select('created_at,answer').eq('user_id',S.user.id).order('created_at',{ascending:false}).limit(40);S.checkins=(q&&q.data)||[];}catch(e){S.checkins=[];}}
async function loadTimelineEvents(){
  if(!sb||!S.user){S.timelineEvents=[];return;}
  try{
    var qCheck=sb.from('selfsense_checkins').select('created_at,answer').eq('user_id',S.user.id).order('created_at',{ascending:false}).limit(12);
    var qCrisis=sb.from('selfsense_crisis_log').select('created_at,trigger_type').eq('user_id',S.user.id).order('created_at',{ascending:false}).limit(12);
    var qMirror=sb.from('selfsense_mirror_sessions').select('created_at,mode,duration_seconds,messages_count').eq('user_id',S.user.id).order('created_at',{ascending:false}).limit(12);
    var res=await Promise.all([qCheck,qCrisis,qMirror]);
    var checks=((res[0]&&res[0].data)||[]).map(function(r){return {type:'checkin',created_at:r.created_at,label:'Check-in: '+String(r.answer||'').trim()};});
    var crises=((res[1]&&res[1].data)||[]).map(function(r){
      var tt=String(r.trigger_type||'').trim()||'onbekend';
      return {type:'crisis',created_at:r.created_at,label:'Crisisflow geactiveerd ('+tt+')'};
    });
    var mirrors=((res[2]&&res[2].data)||[]).map(function(r){
      var mode=String(r.mode||'spiegel').trim();
      var dur=Math.max(0,Number(r.duration_seconds||0));
      var mins=Math.max(1,Math.round(dur/60));
      var extra=(mode==='adem')?(' ('+mins+' min)'):'';
      return {type:'mirror',created_at:r.created_at,label:'Spiegel '+mode+extra};
    });
    var all=checks.concat(crises).concat(mirrors).filter(function(x){return !!x.created_at;});
    all.sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at);});
    S.timelineEvents=all.slice(0,30);
  }catch(e){
    S.timelineEvents=[];
  }
}
async function loadUserState(){if(!sb||!S.user){S.userState=null;return;}try{var r=await sb.from('selfsense_user_state').select('*').eq('user_id',S.user.id).maybeSingle();S.userState=r&&r.data?r.data:{user_id:S.user.id};}catch(e){S.userState={user_id:S.user.id};}}
async function saveUserState(patch){if(!sb||!S.user)return;S.userState=Object.assign({},S.userState||{user_id:S.user.id},patch||{});try{await sb.from('selfsense_user_state').upsert(S.userState,{onConflict:'user_id'});}catch(e){console.warn('save user state',e);}}
async function maybeShowDailyCheckin(){if(!sb||!S.user)return;try{var q=await sb.from('selfsense_checkins').select('created_at').eq('user_id',S.user.id).order('created_at',{ascending:false}).limit(1);var rows=(q&&q.data)||[];if(rows.length&&isSameLocalDate(new Date(rows[0].created_at),new Date()))return;showCheckinModal(true);}catch(e){console.warn('daily checkin check:',e);}}
async function saveCheckin(answer){showCheckinModal(false);if(!sb||!S.user)return;try{var ins=await sb.from('selfsense_checkins').insert({user_id:S.user.id,answer:String(answer||''),note:null});if(ins&&ins.error)throw ins.error;toast('Check-in opgeslagen');await loadRecentCheckins();await loadTimelineEvents();await maybeApplySoftTriggers();goScreen('vragen');}catch(e){toast('Check-in kon niet opgeslagen worden');}}
async function maybeApplySoftTriggers(){
  if(!S.user)return;var rows=S.checkins||[];var greeting='';
  var latestAnswer=rows.length?String(rows[0].answer||'').toLowerCase():'';
  if(latestAnswer==='beter'||latestAnswer==='hetzelfde'){
    if(S.userState&&S.userState.heavy2_blocked){
      await saveUserState({heavy2_blocked:false});
    }
  }
  if(rows.length>=2){
    var d0=new Date(rows[0].created_at),d1=new Date(rows[1].created_at);
    if(String(rows[0].answer||'').toLowerCase()==='heel zwaar'&&String(rows[1].answer||'').toLowerCase()==='heel zwaar'&&areConsecutiveDays(d0,d1)){
      var streakKey=dateOnly(d0);
      var blocked=!!(S.userState&&S.userState.heavy2_blocked);
      if(!blocked){
        greeting='Ik wil dat je weet, als dit blijft drukken, kan je ook even bellen of chatten met iemand. Tele-Onthaal op 106 is 24 uur bereikbaar. Het is gratis en je hoeft je naam niet te zeggen.';
        await saveUserState({heavy2_last_shown_for:streakKey,heavy2_blocked:true});
      }
    }
  }
  if(!greeting&&rows.length){
    var now=Date.now(),windowRows=rows.filter(function(r){var t=new Date(r.created_at).getTime();return now-t<=14*24*60*60*1000;});
    if(windowRows.length&&windowRows.every(function(r){return String(r.answer||'').toLowerCase()!=='beter';})){
      var lastShown=S.userState&&S.userState.no_improvement_last_shown_at?new Date(S.userState.no_improvement_last_shown_at).getTime():0;
      if(!lastShown||now-lastShown>=30*24*60*60*1000){greeting='Twee weken zonder beweging is een signaal. Als je dit met iemand wil bespreken, dan kan dat. Tele-Onthaal (106) of een huisarts is een goede start.';await saveUserState({no_improvement_last_shown_at:new Date().toISOString()});}
    }
  }
  S.greeting=greeting;
}
async function initUserContext(){await loadUserState();await loadRecentCheckins();await loadTimelineEvents();await maybeApplySoftTriggers();await refreshSelfSenseOwnContext();}
async function init(){goScreen('vragen');if(!sb){toast('Supabase niet beschikbaar');goScreen('login');return;}try{await handlePendingAuthFromUrl();}catch(_e){}try{var sessionRes=await withTimeout(sb.auth.getSession(),7000,'Sessie laden time-out');var session=sessionRes&&sessionRes.data&&sessionRes.data.session;if(session){S.user=session.user;S.apiKey='hub_server_managed';await initUserContext();goScreen('vragen');rDrawer();await maybeShowDailyCheckin();}else goScreen('login');}catch(e){goScreen('login');}
  sb.auth.onAuthStateChange(async function(ev,ses){if(ev==='SIGNED_IN'&&ses){S.user=ses.user;S.apiKey='hub_server_managed';S.conversation=[];await initUserContext();goScreen('vragen');rDrawer();await maybeShowDailyCheckin();}else if(ev==='SIGNED_OUT'){S.user=null;S.apiKey='';goScreen('login');}});
}
document.getElementById('helpModal').addEventListener('click',function(ev){if(ev.target&&ev.target.id==='helpModal')closeHelpModal();});
document.addEventListener('visibilitychange',function(){
  if(!S.mirror||!S.mirror.active)return;
  if(document.visibilityState==='hidden'){
    if(S.mirror.mode==='praat'||S.mirror.mode==='gesprek'){
      S.mirror.paused=true;
      S.mirror.pauseReason='tab_hidden';
    }
    stopActiveMediaStream();
    resetMirrorSpeech();
    return;
  }
  if(document.visibilityState==='visible'&&S.mirror.paused){
    renderMirrorPausePrompt();
  }
});
window.addEventListener('beforeunload',function(){stopActiveMediaStream();resetMirrorSpeech();});
document.addEventListener('DOMContentLoaded',init);
</script>
